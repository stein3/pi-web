services:
  pi-web:
    image: pi-local:latest
    build: .
    container_name: pi-web
    restart: unless-stopped
    entrypoint: ["node", "/app/pi-web.mjs"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8124"
      - "--dir"
      - "/home/node/.pi/agent"
      - "--dist"
      - "/app/webui"
      - "--cwd"
      - "/workspace"
    ports:
      - "3002:8124"
    volumes:
      - pi-home:/home/node
      - ./config/pi-agent:/home/node/.pi/agent
      - ${HOST_WORKSPACE}:/workspace
      # webui dist lives in the sibling nopencode checkout (built once with
      # `cd ../opencode/webui && npm ci && npm run build`).
      - ../opencode/webui/dist:/app/webui:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8

volumes:
  pi-home:
